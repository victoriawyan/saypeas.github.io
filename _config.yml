# Site Settings
title: "Victoria Yan"
name: "Victoria Yan"
description: "Writer and researcher"
url: "https://victoriawyan.com"
baseurl: ""


# Build settings
markdown: kramdown
permalink: /:title/

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README
  - LICENSE

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
